name: CI - Test and Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          shopt -s nullglob
          requirements=(resources/*/requirements.txt)
          if [[ -f requirements.txt ]]; then
            requirements=(requirements.txt "${requirements[@]}")
          fi
          if ((${#requirements[@]})); then
            for file in "${requirements[@]}"; do
              echo "Installing $file"
              python -m pip install -r "$file"
            done
          else
            echo "No requirements.txt found; continuing with the Python standard library."
          fi
          python -m pip install pytest nbformat

      - name: Compile all Python scripts
        shell: bash
        run: |
          mapfile -t scripts < <(find . -type f -name '*.py' -not -path './.git/*' -not -path '*/__pycache__/*' | sort)
          if ((${#scripts[@]} == 0)); then
            echo "No Python scripts found in this repository."
          else
            printf 'Validating %s Python scripts\n' "${#scripts[@]}"
            python -m py_compile "${scripts[@]}"
          fi

      - name: Validate Jupyter notebooks
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          import nbformat

          notebooks = sorted(Path('.').rglob('*.ipynb'))
          notebooks = [p for p in notebooks if '.git' not in p.parts and '.ipynb_checkpoints' not in p.parts]
          if not notebooks:
              print('No Jupyter notebooks found in this repository.')
          for path in notebooks:
              with path.open(encoding='utf-8') as handle:
                  notebook = nbformat.read(handle, as_version=4)
              for index, cell in enumerate(notebook.cells):
                  if cell.cell_type == 'code':
                      try:
                          ast.parse(cell.source, filename=f'{path}:cell-{index + 1}')
                      except SyntaxError as error:
                          raise SystemExit(f'Notebook code validation failed in {path}, cell {index + 1}: {error}')
              print(f'Validated {path}')
          PY

      - name: Run repository tests
        shell: bash
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -not -path './.git/*' | grep -q .; then
            python -m pytest -q
          else
            echo "No pytest test files found; compile and notebook validation completed."
          fi
